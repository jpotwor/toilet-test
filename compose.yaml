services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - .:/workspace
      - ${SSH_AUTH_SOCK}:/ssh-agent
    environment:
      SSH_AUTH_SOCK: /ssh-agent
    working_dir: /workspace/backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
